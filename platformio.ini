; PlatformIO Configuration for Road Line Marking Controller
; Project: KTR251 - Road Marking Computer v1.1.0
; Target: ESP32-S3 N16R8 (FCC ID: 2AD6X-ESP32S3N16R8)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ============================================================================
; ESP32-S3-WROOM-1 N16R8 CONFIGURATION
; - 16MB Quad Flash
; - 8MB Octal PSRAM
; ============================================================================
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; KLUCZOWE: Flash w trybie DIO (nie QIO!) dla N16R8
board_build.flash_mode = dio
board_build.flash_size = 16MB

; Partycje dla 16MB Flash
board_build.partitions = default_16MB.csv

; PSRAM Octal - poprawna konfiguracja
board_build.arduino.memory_type = qio_opi

build_flags =
    ; PSRAM
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    ; USB CDC dla Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Debug na maksimum żeby zobaczyć co się dzieje
    -DCORE_DEBUG_LEVEL=4
    ; Większy stos dla main task
    -DARDUINO_LOOP_STACK_SIZE=16384

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload
upload_speed = 921600

; Biblioteki
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1

; Debug build żeby zobaczyć stack trace
build_type = debug
